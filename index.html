<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control de Vouchers</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">V</span>
      <span class="brand-name">Control de Vouchers</span>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-view="captura">Capturar</button>
      <button class="tab-btn" data-view="registro">Registro</button>
    </nav>
  </header>

  <main>
    <!-- VISTA: CAPTURA -->
    <section id="view-captura" class="view active">
      <div class="capture-card">
        <label for="file-input" class="capture-drop">
          <div class="capture-icon">📷</div>
          <p class="capture-text">Toca para tomar foto o subir el voucher</p>
          <input id="file-input" type="file" accept="image/*" capture="environment" hidden />
        </label>
        <img id="preview-img" class="preview-img" hidden />
      </div>

      <div id="status-msg" class="status-msg" hidden></div>

      <form id="voucher-form" class="voucher-form" hidden>
        <h3>Confirma los datos extraídos</h3>
        <div class="form-grid">
          <label>Número de voucher
            <input type="text" name="numero_voucher" />
          </label>
          <label>Fecha del voucher
            <input type="date" name="fecha_voucher" />
          </label>
          <label>Huésped
            <input type="text" name="huesped" />
          </label>
          <label>Habitación
            <input type="text" name="habitacion" />
          </label>
          <label>Proveedor / Agencia
            <input type="text" name="proveedor" />
          </label>
          <label>Monto
            <input type="number" step="0.01" name="monto" />
          </label>
          <label>Moneda
            <input type="text" name="moneda" value="COP" />
          </label>
          <label class="full">Observaciones
            <textarea name="observaciones" rows="2"></textarea>
          </label>
        </div>
        <div class="form-actions">
          <button type="button" id="btn-cancel" class="btn btn-ghost">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar en registro</button>
        </div>
      </form>
    </section>

    <!-- VISTA: REGISTRO -->
    <section id="view-registro" class="view">
      <div class="registro-toolbar">
        <input id="search-input" type="text" placeholder="Buscar por huésped, habitación o número..." />
        <button id="btn-export" class="btn btn-primary">Exportar a Excel</button>
      </div>
      <div id="registro-list" class="registro-list">
        <p class="empty-state">Cargando registros...</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" ></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
