<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LayOverOS | Control de Vouchers</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ============================= -->
  <!-- LOGIN -->
  <!-- ============================= -->

  <div id="login-screen" class="login-screen">

    <div class="login-card">

      <div class="login-logo">
        <span class="brand-mark">L</span>
      </div>

      <h1>LayOverOS</h1>

      <p>Control de vouchers hoteleros</p>

      <form id="login-form">

        <label>
          Usuario
          <input
            id="login-usuario"
            type="text"
            placeholder="Ej. JDIAZ"
            autocomplete="username"
            required
          />
        </label>

        <label>
          Contraseña
          <input
            id="login-password"
            type="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            required
          />
        </label>

        <button
          type="submit"
          class="btn btn-primary"
        >
          Ingresar
        </button>

        <p
          id="login-error"
          class="login-error"
        ></p>

      </form>

    </div>

  </div>


  <!-- ============================= -->
  <!-- APLICACIÓN -->
  <!-- ============================= -->

  <div id="app">

    <header class="topbar">

      <div class="brand">

        <span class="brand-mark">L</span>

        <span class="brand-name">
          LayOverOS
        </span>

      </div>

      <nav class="tabs">

        <button
          class="tab-btn active"
          data-view="captura"
        >
          Capturar
        </button>

        <button
          class="tab-btn"
          data-view="registro"
        >
          Registro
        </button>

      </nav>

    </header>


    <main>

      <!-- ============================= -->
      <!-- CAPTURAR -->
      <!-- ============================= -->

      <section
        id="view-captura"
        class="view active"
      >

        <div class="capture-card">

          <label
            for="file-input"
            class="capture-drop"
          >

            <div class="capture-icon">
              📷
            </div>

            <p class="capture-text">
              Toca para tomar una foto o subir un voucher
            </p>

            <small>
              LayOverOS analizará automáticamente la información
            </small>

            <input
              id="file-input"
              type="file"
              accept="image/*"
              capture="environment"
              hidden
            />

          </label>


          <img
            id="preview-img"
            class="preview-img"
            hidden
            alt="Vista previa del voucher"
          />

        </div>


        <div
          id="status-msg"
          class="status-msg"
          hidden
        ></div>


        <!-- FORMULARIO -->

        <form
          id="voucher-form"
          class="voucher-form"
          hidden
        >

          <h3>
            Revisa la información del voucher
          </h3>

          <p class="form-description">
            La información fue extraída automáticamente.
            Corrige cualquier dato antes de guardarlo.
          </p>


          <div class="form-grid">

            <label>
              Número de voucher

              <input
                type="text"
                name="numero_voucher"
                placeholder="Ej. 8281385984"
              />

            </label>


            <label>
              Aerolínea

              <input
                type="text"
                name="aerolinea"
                placeholder="Ej. Avianca"
              />

            </label>


            <label>
              Pasajero

              <input
                type="text"
                name="huesped"
                placeholder="Nombre del pasajero"
              />

            </label>


            <label>
              Vuelo

              <input
                type="text"
                name="vuelo"
                placeholder="Ej. AV8580"
              />

            </label>


            <label>
              Fecha del vuelo

              <input
                type="date"
                name="fecha_vuelo"
              />

            </label>


            <label>
              Fecha de emisión

              <input
                type="date"
                name="fecha_emision"
              />

            </label>


            <label>
              Habitación

              <input
                type="text"
                name="habitacion"
                placeholder="Número de habitación"
              />

            </label>


            <label>
              Servicio

              <input
                type="text"
                name="servicio"
                placeholder="Ej. Alojamiento, desayuno y WiFi"
              />

            </label>


            <label>
              Días

              <input
                type="number"
                name="dias"
                min="0"
              />

            </label>


            <label>
              Noches

              <input
                type="number"
                name="noches"
                min="0"
              />

            </label>


            <label>
              PAX

              <input
                type="number"
                name="pax"
                min="1"
              />

            </label>


            <label>
              Operado por

              <input
                type="text"
                name="operado_por"
                placeholder="Ej. Avianca"
              />

            </label>


            <label>
              Cabina

              <input
                type="text"
                name="cabina"
                placeholder="Ej. Y"
              />

            </label>


            <label>
              Nivel de tarifa

              <input
                type="text"
                name="fare_level"
                placeholder="Ej. AV-LM1"
              />

            </label>


            <label>
              Estado

              <select name="estado">

                <option value="RECIBIDO">
                  Recibido
                </option>

                <option value="VALIDADO">
                  Validado
                </option>

                <option value="UTILIZADO">
                  Utilizado
                </option>

                <option value="COBRADO">
                  Cobrado
                </option>

              </select>

            </label>


            <label class="full">
              Observaciones

              <textarea
                name="observaciones"
                rows="3"
                placeholder="Información adicional..."
              ></textarea>

            </label>

          </div>


          <div class="form-actions">

            <button
              type="button"
              id="btn-cancel"
              class="btn btn-ghost"
            >
              Cancelar
            </button>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Guardar voucher
            </button>

          </div>

        </form>

      </section>


      <!-- ============================= -->
      <!-- REGISTRO -->
      <!-- ============================= -->

      <section
        id="view-registro"
        class="view"
      >

        <div class="registro-toolbar">

          <input
            id="search-input"
            type="text"
            placeholder="Buscar por voucher, pasajero, vuelo, aerolínea..."
          />

          <button
            id="btn-export"
            class="btn btn-primary"
          >
            Exportar a Excel
          </button>

        </div>


        <div
          id="registro-list"
          class="registro-list"
        >

          <p class="empty-state">
            Cargando registros...
          </p>

        </div>

      </section>

    </main>

  </div>


  <!-- ============================= -->
  <!-- LIBRERÍAS -->
  <!-- ============================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script src="config.js"></script>

  <script src="app.js?v=7"></script>

</body>
</html>
